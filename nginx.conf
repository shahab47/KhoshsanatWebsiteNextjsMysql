# ============================================
# تنظیمات سطح بالا (Global)
# ============================================
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# ============================================
# رویدادها (Events)
# ============================================
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# ============================================
# تنظیمات HTTP اصلی
# ============================================
http {
    # ========================================
    # تنظیمات پایه
    # ========================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # فرمت لاگ‌ها
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;
    
    # ========================================
    # تنظیمات عملکرد (Performance)
    # ========================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # مدت زمان نگهداری اتصال
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # زمان پاسخگویی
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    
    # ========================================
    # محدودیت‌های سایز (مهم برای آپلود)
    # ========================================
    client_max_body_size 50M;  # حداکثر سایز آپلود 50 مگابایت
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    
    # ========================================
    # فشرده‌سازی (Compression)
    # ========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;
    
    # ========================================
    # تنظیمات کش (Cache) - بسیار مهم برای سرعت
    # ========================================
    
    # کش برای درخواست‌های API و تصاویر
    proxy_cache_path /var/cache/nginx/api_cache levels=1:2 keys_zone=api_cache:50m max_size=500m inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/image_cache levels=1:2 keys_zone=image_cache:100m max_size=2g inactive=30d use_temp_path=off;
    
    # کش برای فایل‌های استاتیک
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # ========================================
    # محدودیت نرخ درخواست (Rate Limiting)
    # ========================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;
    
    # ========================================
    # آپ스트ریم (Upstream) برای Next.js
    # ========================================
    upstream nextjs_upstream {
        least_conn;  # الگوریتم تعادل بار
        server nextjs_app:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream imgproxy_upstream {
        least_conn;
        server imgproxy:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # ========================================
    # سرور اصلی (Main Server)
    # ========================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        
        # ========================================
        # مسیر سلامت (Health Check)
        # ========================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # ========================================
        # مسیر آپلود (افزایش محدودیت ویژه)
        # ========================================
        location /api/upload {
            client_max_body_size 50M;
            client_body_timeout 120s;
            limit_req zone=upload_limit burst=5 nodelay;
            
            # هدرهای امنیتی
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            
            # پروکسی به Next.js
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # تایم‌اوت‌های طولانی برای آپلود
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
        
        # ========================================
        # مسیر تصاویر و بهینه‌سازی (با کش)
        # ========================================
        location /api/img-proxy {
            client_max_body_size 10M;
            
            # کش تصاویر
            proxy_cache image_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            
            # هدرهای کش برای مرورگر
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            # پروکسی به Imgproxy
            proxy_pass http://imgproxy_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # تایم‌اوت مناسب
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # ========================================
        # فایل‌های استاتیک (سرو مستقیم از دیسک)
        # ========================================
        location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|css|js|json|map|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            access_log off;
            
            # تلاش برای یافتن فایل در پوشه استاتیک، در غیر این صورت پروکسی به Next.js
            root /usr/share/nginx/html/static;
            try_files $uri @nextjs;
        }
        
        # ========================================
        # مسیرهای اصلی Next.js
        # ========================================
        location /api {
            client_max_body_size 10M;
            limit_req zone=api_limit burst=20 nodelay;
            
            # هدرهای امنیتی
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            
            # پروکسی به Next.js
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # کش برای API GET (فقط پاسخ‌های موفق)
            if ($request_method = GET) {
                proxy_cache api_cache;
                proxy_cache_valid 200 5m;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            }
            
            # تایم‌اوت‌ها
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # ========================================
        # صفحات اصلی و مسیرهای دیگر
        # ========================================
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            
            # هدرهای امنیتی
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            
            # پروکسی به Next.js
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # تایم‌اوت‌ها
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # ========================================
        # پاسخ به خطای 413 (درخواست خیلی بزرگ)
        # ========================================
        error_page 413 /413.html;
        location = /413.html {
            root /usr/share/nginx/html;
            internal;
            return 413 '<!DOCTYPE html>
            <html lang="fa" dir="rtl">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>حجم فایل بیش از حد مجاز</title>
                <style>
                    body {
                        font-family: system-ui, -apple-system, sans-serif;
                        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        height: 100vh;
                        margin: 0;
                        direction: rtl;
                    }
                    .error-container {
                        text-align: center;
                        background: white;
                        padding: 2rem;
                        border-radius: 1rem;
                        box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
                        max-width: 500px;
                        margin: 1rem;
                    }
                    h1 { color: #dc2626; font-size: 2rem; margin-bottom: 1rem; }
                    p { color: #4b5563; margin-bottom: 1rem; line-height: 1.5; }
                    .size-info { background: #f3f4f6; padding: 0.75rem; border-radius: 0.5rem; font-family: monospace; }
                    button {
                        background: #3b82f6;
                        color: white;
                        border: none;
                        padding: 0.5rem 1rem;
                        border-radius: 0.5rem;
                        cursor: pointer;
                        margin-top: 1rem;
                    }
                    button:hover { background: #2563eb; }
                </style>
            </head>
            <body>
                <div class="error-container">
                    <h1>📁 حجم فایل بیش از حد مجاز</h1>
                    <p>حجم فایل ارسالی شما از حداکثر مجاز (۵۰ مگابایت) بیشتر است.</p>
                    <div class="size-info">
                        لطفاً فایل را فشرده یا کوچک‌تر انتخاب کنید.
                    </div>
                    <button onclick="history.back()">بازگشت و تلاش مجدد</button>
                </div>
            </body>
            </html>';
        }
        
        # ========================================
        # مسیر فایل‌های استاتیک در زمان fallback
        # ========================================
        location @nextjs {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}