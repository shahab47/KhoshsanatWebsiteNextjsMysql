# ============================================
# تنظیمات سطح بالا (Global)
# ============================================
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ========================================
    # تنظیمات پایه
    # ========================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 250M;   # حداکثر آپلود (برای MinIO و Next.js)

    # ========================================
    # محدودیت نرخ درخواست (Rate Limiting) - باید قبل از سرور بلاک‌ها تعریف شود
    # ========================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

    # ========================================
    # آپستریم‌ها (Upstream) برای سرویس‌های داخلی داکر
    # ========================================
    upstream nextjs {
        server nextjs_app:3000 max_fails=3 fail_timeout=30s;
    }

    upstream minio {
        server minio:9000 max_fails=3 fail_timeout=30s;
    }

    upstream minio_console {
        server minio:9001 max_fails=3 fail_timeout=30s;
    }

    upstream imgproxy {
        server imgproxy:8080 max_fails=3 fail_timeout=30s;
    }

    upstream adminer {
        server adminer:8080 max_fails=3 fail_timeout=30s;
    }

    # ========================================
    # بلوک ریدایرکت HTTP به HTTPS (در صورت وجود SSL)
    # ========================================
    server {
        listen 80;
        listen [::]:80;
        server_name khoshsanat.ir www.khoshsanat.ir;
        return 301 https://$host$request_uri;
    }

    # ========================================
    # بلوک اصلی HTTPS (با گواهی‌های Let's Encrypt)
    # ========================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name khoshsanat.ir www.khoshsanat.ir;

        # مسیر گواهی‌ها (باید از هاست mount شوند)
        ssl_certificate /etc/nginx/ssl/live/khoshsanat.ir/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/khoshsanat.ir/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ------------------------------------------------------------
        # Adminer (مدیریت دیتابیس)
        # ------------------------------------------------------------
        location /adminer/ {
            proxy_pass http://adminer/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------
        # MinIO Console (UI مدیریت)
        # ------------------------------------------------------------
        location ^~ /minio/ui/ {
            rewrite ^/minio/ui/(.*) /$1 break;
            proxy_pass http://minio_console/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 0;
            proxy_buffering off;
        }

        # ------------------------------------------------------------
        # MinIO Server (API و دانلود فایل‌ها)
        # ------------------------------------------------------------
        location /minio/ {
            proxy_pass http://minio/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 250M;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # ------------------------------------------------------------
        # Imgproxy (پردازش تصاویر)
        # ------------------------------------------------------------
        location /imgproxy/ {
            proxy_pass http://imgproxy/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 0;
            proxy_buffering off;
        }

        # ------------------------------------------------------------
        # Next.js API Upload (با محدودیت نرخ ویژه)
        # ------------------------------------------------------------
        location /api/upload {
            limit_req zone=upload_limit burst=5 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 250M;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # ------------------------------------------------------------
        # سایر API‌های Next.js
        # ------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------
        # فایل‌های استاتیک (تصاویر، CSS، JS)
        # ------------------------------------------------------------
        location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|css|js|json|map|woff|woff2|ttf|eot)$ {
            access_log off;
            proxy_pass http://nextjs;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ------------------------------------------------------------
        # بقیه مسیرها (صفحات Next.js)
        # ------------------------------------------------------------
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}